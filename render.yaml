services:
  - type: web
    name: campus-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TIMEZONE
        value: Asia/Almaty
      - key: MAP_DIR
        value: map
      - key: MAP_FLOOR_COUNT
        value: "3"
      - key: STAROSTA_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
